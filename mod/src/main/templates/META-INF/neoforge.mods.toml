modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="CrayonDev26"
logoFile="logo.png"
logoBlur=false
description='''
Some nights the ground starts to shake, a mist rolls in, and a 28-block-tall giant of stone, moss and snow rises out of it.
It walks the plains until dawn, flattening trees, walls and houses in its path, and only fights back when you strike it.
Break the ore off its body as it weakens, bring it down for diamonds and the Mountain Heart, and forge the Mountain Hammer
and Mountain armour from what it leaves behind. Can't wait for a night? Blow the Mountain Horn.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.9,)"
    ordering="NONE"
    side="BOTH"
